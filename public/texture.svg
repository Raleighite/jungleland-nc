<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Subtle tileable tropical leaf / vine texture. Rendered at low opacity by the site. -->
  <g fill="none" stroke="#F5E6C8" stroke-width="1.5" stroke-linecap="round">
    <!-- vine curls -->
    <path d="M18 38 q14 -16 30 -8 q12 6 8 20"/>
    <path d="M132 168 q18 -10 30 4 q8 10 -2 22" transform="rotate(-12 150 180)"/>
    <path d="M158 52 q-12 14 2 26"/>
  </g>
  <g fill="#F5E6C8">
    <!-- fan palm leaf, upper left -->
    <g transform="translate(52 86) rotate(-24)">
      <path d="M0 0 Q4 -26 0 -44 Q-4 -26 0 0Z"/>
      <path d="M0 0 Q16 -22 26 -34 Q4 -22 0 0Z"/>
      <path d="M0 0 Q-16 -22 -26 -34 Q-4 -22 0 0Z"/>
      <path d="M0 0 Q24 -10 36 -12 Q12 -8 0 0Z"/>
      <path d="M0 0 Q-24 -10 -36 -12 Q-12 -8 0 0Z"/>
    </g>
    <!-- simple frond, right side -->
    <g transform="translate(154 118) rotate(38)">
      <path d="M0 0 Q2 -34 0 -52 Q-2 -34 0 0Z"/>
      <path d="M0 -8 Q12 -16 18 -26 Q6 -16 0 -12Z"/>
      <path d="M0 -8 Q-12 -16 -18 -26 Q-6 -16 0 -12Z"/>
      <path d="M0 -22 Q10 -30 14 -40 Q4 -28 0 -26Z"/>
      <path d="M0 -22 Q-10 -30 -14 -40 Q-4 -28 0 -26Z"/>
    </g>
    <!-- small leaf pair, lower left -->
    <g transform="translate(40 168) rotate(12)">
      <path d="M0 0 Q10 -10 22 -10 Q12 0 0 0Z"/>
      <path d="M0 0 Q10 8 22 9 Q12 2 0 0Z"/>
    </g>
    <!-- tiny leaf, top right -->
    <g transform="translate(118 28) rotate(-40)">
      <path d="M0 0 Q8 -9 18 -9 Q9 -1 0 0Z"/>
    </g>
    <!-- berries / dots -->
    <circle cx="84" cy="34" r="2"/>
    <circle cx="90" cy="40" r="1.5"/>
    <circle cx="176" cy="156" r="2"/>
    <circle cx="26" cy="120" r="1.5"/>
    <circle cx="104" cy="184" r="2"/>
  </g>
</svg>
